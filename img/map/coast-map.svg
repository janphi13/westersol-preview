  <title>Western Costa del Sol, San Pedro de Alcántara to Sotogrande</title>
  <desc>A simple map of the coast between San Pedro de Alcántara and Sotogrande, with Estepona, Casares, Manilva, Sabinillas and La Duquesa marked in their real positions. Coastline © OpenStreetMap contributors (ODbL).</desc>
  <style>
